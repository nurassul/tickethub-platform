server:
  port: 8087

spring:
  application:
    name: statistic-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: statistic-group-v1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/statistic_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

app:
  kafka:
    topics:
      booking-events: ${KAFKA_BOOKING_EVENTS_TOPIC:tickethub.booking.events.v1}
      ticket-events: ${KAFKA_TICKET_EVENTS_TOPIC:tickethub.ticket.events.v1}
